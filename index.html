<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}
:root{
  color-scheme:light;
  --bg:#F2F5F4; --bg2:#E7ECEA; --card:#FFFFFF; --card2:#EEF2F1; --ink:#14201E; --muted:#667873; --line:#DCE3E0;
  --acc:#0F9D7A; --acc-2:#0B7A5F; --acc-ink:#FFFFFF; --acc-soft:#D7F1E9;
  --plus:#0E9A6C; --minus:#D8442F; --minus-soft:#FBE3DE; --warn:#C98A12;
  --hero1:#0F9D7A; --hero2:#0A6E5C; --scrim:rgba(8,16,15,.5);
  --font:"Golos Text","Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11161B; --bg2:#0B0F13; --card:#1A2027; --card2:#232A32; --ink:#EEF3F1; --muted:#8D9A97; --line:#2A323B;
    --acc:#22C08F; --acc-2:#0F8F6A; --acc-ink:#062018; --acc-soft:#16362D;
    --plus:#2FCB8C; --minus:#FF6B57; --minus-soft:#3A1E1B; --warn:#F1B541;
    --hero1:#139B77; --hero2:#0B5E4B; --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11161B; --bg2:#0B0F13; --card:#1A2027; --card2:#232A32; --ink:#EEF3F1; --muted:#8D9A97; --line:#2A323B;
  --acc:#22C08F; --acc-2:#0F8F6A; --acc-ink:#062018; --acc-soft:#16362D;
  --plus:#2FCB8C; --minus:#FF6B57; --minus-soft:#3A1E1B; --warn:#F1B541;
  --hero1:#139B77; --hero2:#0B5E4B; --scrim:rgba(0,0,0,.6);
}
/* in-app theme choice wins over the host */
:root.skin-dark{
  color-scheme:dark;
  --bg:#11161B; --bg2:#0B0F13; --card:#1A2027; --card2:#232A32; --ink:#EEF3F1; --muted:#8D9A97; --line:#2A323B;
  --acc:#22C08F; --acc-2:#0F8F6A; --acc-ink:#062018; --acc-soft:#16362D;
  --plus:#2FCB8C; --minus:#FF6B57; --minus-soft:#3A1E1B; --warn:#F1B541;
  --hero1:#139B77; --hero2:#0B5E4B; --scrim:rgba(0,0,0,.6);
}
:root.skin-light{
  color-scheme:light;
  --bg:#F2F5F4; --bg2:#E7ECEA; --card:#FFFFFF; --card2:#EEF2F1; --ink:#14201E; --muted:#667873; --line:#DCE3E0;
  --acc:#0F9D7A; --acc-2:#0B7A5F; --acc-ink:#FFFFFF; --acc-soft:#D7F1E9;
  --plus:#0E9A6C; --minus:#D8442F; --minus-soft:#FBE3DE; --warn:#C98A12;
  --hero1:#0F9D7A; --hero2:#0A6E5C; --scrim:rgba(8,16,15,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
svg{display:block}
.num{font-variant-numeric:tabular-nums}

.shell{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:96px;-webkit-overflow-scrolling:touch}
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{display:grid;justify-items:center;gap:3px;font-size:12px;color:var(--muted);padding:4px 0}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="page"]{color:var(--acc)}

/* home */
.hero{background:linear-gradient(160deg,var(--hero1),var(--hero2));color:#fff;padding:22px 16px 46px}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.total{display:flex;align-items:center;gap:12px;min-width:0}
.total b{font-size:34px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.total small{display:block;font-size:12.5px;opacity:.85;letter-spacing:.02em}
.ibtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.hero .ibtn{color:#fff;background:rgba(255,255,255,.12)}
.hero .ibtn svg{width:22px;height:22px}
.hero-sub{display:flex;gap:18px;margin-top:10px;font-size:13px;opacity:.92;flex-wrap:wrap}
.hero-sub span b{font-weight:600}
.panel{background:var(--bg);border-radius:26px 26px 0 0;margin-top:-26px;position:relative;padding:16px 0 0}
.searchbar{margin:0 16px 12px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.searchbar svg{width:18px;height:18px;color:var(--muted);flex:none}
.searchbar input{border:0;background:transparent;padding:11px 0;width:100%;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14.5px;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.chip.icon{padding:8px 12px;display:grid;place-items:center}
.chip.icon svg{width:20px;height:20px}
.rows{display:grid}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:12px 16px;text-align:left;width:100%}
.row + .row .rtext{border-top:0}
.row .rtext{min-width:0}
.row .nm{font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase}
.row .ph{font-size:14px;color:var(--muted)}
.row .rv{text-align:right;white-space:nowrap}
.row .rv b{font-weight:500;font-size:15.5px}
.row .rv small{display:block;font-size:12.5px;color:var(--muted)}
.rowline{height:1px;background:var(--line);margin-left:82px}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--card2);color:var(--muted);font-size:18px;font-weight:500}
.plus{color:var(--plus)} .minus{color:var(--minus)} .mute{color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--card2);color:var(--muted);margin-left:6px;vertical-align:2px;text-transform:none;font-weight:500}
.tag.od{background:var(--minus-soft);color:var(--minus)}
.sendrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sendrow a{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:14px 8px;font-weight:500;text-decoration:none;text-align:center}
.sendrow a svg{width:22px;height:22px;flex:none}
.sendrow .wa{background:#1FAF5B;color:#fff}
.sendrow .tgb{background:#2A9BD8;color:#fff}
.duebox{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:14px}
.x.rc{color:var(--acc)}
.empty{text-align:center;color:var(--muted);padding:44px 24px}
.fab{position:absolute;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:5}
.fab svg{width:28px;height:28px}

/* page header */
.phead{position:sticky;top:0;z-index:3;background:var(--bg);display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:12px 8px;border-bottom:1px solid var(--line)}
.phead h1{margin:0;text-align:center;font-size:19px;font-weight:500}
.phead .ibtn{color:var(--ink)}
.phead .ibtn svg{width:24px;height:24px}

/* wallet */
.wcard{margin:18px 16px;border-radius:22px;padding:22px 20px;background:linear-gradient(150deg,var(--hero1),var(--hero2));color:#fff;display:grid;gap:10px}
.wcard .top{display:flex;justify-content:space-between;align-items:center}
.wcard .lbl{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.wcard .big{font-size:40px;font-weight:600;letter-spacing:-.01em}
.wcard p{margin:0;font-size:14px;opacity:.9}
.wcard .tools{display:flex;gap:6px}
.wcard .tools .ibtn{color:#fff}
.wbtn{margin-top:6px;background:#fff;color:#0B2B24;border-radius:14px;padding:14px;font-weight:500;font-size:16px}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 16px 8px}
.methods div{background:var(--card);border-radius:14px;padding:10px 12px}
.methods span{display:block;font-size:12px;color:var(--muted)}
.methods b{font-weight:600;font-size:14.5px}
.dayh{padding:16px 16px 6px;color:var(--muted);font-size:14.5px}
.ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--card2)}
.ic svg{width:24px;height:24px}
.ic.cash{background:var(--acc-soft);color:var(--acc)}
.pillnote{grid-column:2 / 4;background:var(--card2);color:var(--muted);border-radius:12px;padding:8px 14px;font-size:14px;margin-top:-4px}
.hrow{display:grid;grid-template-columns:52px 1fr auto;gap:6px 14px;align-items:center;padding:10px 16px;width:100%;text-align:left}
.hrow .nm{font-size:16px;font-weight:500;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .tm{font-size:14px;color:var(--muted)}
.hrow .v{font-size:16px;font-weight:500;white-space:nowrap;align-self:start;margin-top:4px}

/* history month card */
.mcard{margin:10px 16px 4px;background:var(--card);border-radius:18px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;width:calc(100% - 32px);text-align:left}
.mcard span{color:var(--muted);font-size:15px}
.mcard b{display:block;font-weight:500;font-size:17px;margin-top:2px}
.mcard svg{width:20px;height:20px;color:var(--muted)}
.chips.hist .chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}

/* profile */
.pname{padding:24px 16px 6px}
.pname h2{margin:0;font-size:24px;font-weight:500;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname p{margin:2px 0 0;color:var(--muted);font-size:15px}
.group{margin:14px 16px;background:var(--card);border-radius:22px;padding:8px 0}
.group h3{margin:0;padding:12px 20px 4px;font-size:16px;font-weight:500}
.item{display:grid;grid-template-columns:48px 1fr 20px;gap:14px;align-items:center;padding:10px 20px;width:100%;text-align:left}
.item .ii{width:48px;height:48px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;color:var(--ink)}
.item .ii svg{width:22px;height:22px}
.item span{font-size:16px}
.item span small{display:block;font-size:12.5px;color:var(--muted)}
.item > svg{width:18px;height:18px;color:var(--muted)}
.item + .item{border-top:0}
.sep{height:1px;background:var(--line);margin-left:82px}
.social{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 16px 14px;text-align:center}
.social a{display:grid;justify-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:14px}
.social a span{width:60px;height:60px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;color:var(--ink)}
.social a svg{width:28px;height:28px}
.social p{grid-column:1/-1;margin:6px 0 4px;color:var(--muted)}
.outrow{display:grid;grid-template-columns:1fr 64px;gap:12px;margin:14px 16px}
.outrow button{background:var(--card);border-radius:18px;padding:18px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px}
.outrow .trash{background:var(--minus-soft);color:var(--minus);padding:0}
.outrow svg{width:24px;height:24px}
.ver{text-align:center;color:var(--muted);font-size:14px;padding:6px 0 20px}

/* sub page */
.sub{position:absolute;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column}
.sub .body{flex:1;overflow-y:auto;padding:0 16px 24px}
.sub .foot{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.btn{width:100%;border-radius:16px;padding:15px;font-size:16px;font-weight:500;text-align:center}
.btn.acc{background:var(--acc);color:var(--acc-ink)}
.btn.red{background:var(--minus);color:#fff}
.btn.soft{background:var(--card);color:var(--ink)}
.btn.line{border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.h2c{text-align:center;margin:24px 0 4px;font-size:24px;font-weight:500}
.subt{text-align:center;color:var(--muted);margin:0 0 18px;font-size:14.5px}
.opts{background:var(--card);border-radius:20px;overflow:hidden}
.opt{display:grid;grid-template-columns:30px 1fr auto;gap:14px;align-items:center;padding:16px 18px;width:100%;text-align:left;border-top:1px solid var(--line)}
.opt:first-child{border-top:0}
.opt[aria-checked="true"]{background:var(--acc-soft)}
.radio{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center}
.opt[aria-checked="true"] .radio{border-color:var(--acc)}
.opt[aria-checked="true"] .radio::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--acc)}
.opt b{font-weight:500;font-size:16.5px;display:block}
.opt small{color:var(--muted);font-size:13.5px}
.opt .pr{font-size:16px}
.field{display:grid;gap:6px;margin-top:14px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field textarea,.field select{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;width:100%;outline:none}
.field textarea{min-height:96px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--acc)}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.infobox{background:var(--card);border-radius:16px;padding:14px 16px;color:var(--muted);font-size:14px;margin-top:14px;line-height:1.5}
.faq{background:var(--card);border-radius:16px;margin-top:10px}
.faq summary{padding:15px 16px;font-weight:500;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
.faq summary::after{content:"+";color:var(--muted);font-size:20px;line-height:1}
.faq[open] summary::after{content:"−"}
.faq p{margin:0;padding:0 16px 15px;color:var(--muted);line-height:1.55}
.prose{color:var(--ink);line-height:1.6}
.prose h4{margin:18px 0 4px;font-size:15px}
.prose p{margin:0 0 8px;color:var(--muted)}

/* sheets */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:94%;overflow-y:auto;border-radius:24px 24px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.7}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 10px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shead h2{margin:0;font-size:19px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shead .ibtn{background:var(--card);color:var(--muted)}
.shead .ibtn svg{width:20px;height:20px}
.money{font-size:30px!important;font-weight:600;letter-spacing:-.01em}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.quick button{border:1.5px solid var(--line);border-radius:12px;padding:7px 12px;font-size:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:14px;padding:4px;gap:4px}
.seg button{border-radius:10px;padding:9px 4px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.cbal{background:var(--card);border-radius:20px;padding:18px;margin-top:12px;display:grid;gap:2px}
.cbal span{color:var(--muted);font-size:13.5px}
.cbal b{font-size:32px;font-weight:600}
.cbal .ph{display:flex;align-items:center;justify-content:space-between;margin-top:8px;color:var(--muted);gap:10px}
.cbal .ph button{border:1.5px solid var(--line);border-radius:10px;padding:5px 12px;font-size:13.5px;color:var(--ink)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.acts .btn{display:flex;align-items:center;justify-content:center;gap:8px}
.acts svg{width:20px;height:20px}
.mini{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mini button{flex:1;min-width:0;background:var(--card);border-radius:14px;padding:11px 8px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.mini svg{width:18px;height:18px}
.mini .dang{color:var(--minus)}
.sect{color:var(--muted);font-size:14px;margin:18px 2px 4px}
.hlist{background:var(--card);border-radius:18px;overflow:hidden}
.hlist .hrow{padding:10px 12px}
.hlist .ic{width:44px;height:44px}
.hrow .x{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.confirm{background:var(--minus-soft);border-radius:16px;padding:14px;margin-top:12px;display:grid;gap:10px}
.confirm p{margin:0}

/* ===== modern skin ===== */

body{font-size:15px}

.nav{position:absolute;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);border-radius:24px;padding:6px;background:color-mix(in srgb, var(--card) 86%, transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:6}

const live = () => S.entries.filter(e=>!e.deleted);
function bal(cid){ let b=0; for(const e of S.entries){ if(e.c===cid && !e.deleted) b += e.t==="give" ? +e.a : -e.a; } return Math.round(b*100)/100; }

function addMonths(ms, n){ const d = new Date(ms); const day = d.getDate(); d.setMonth(d.getMonth()+n); if(d.getDate()<day) d.setDate(0); return d.getTime(); }
function schedule(cid){
  const es = S.entries.filter(e=>e.c===cid && !e.deleted).sort((a,b)=>a.at-b.at);
  let paid = es.filter(e=>e.t==="take").reduce((s,e)=>s+ +e.a,0);
  const parts = [];
  for(const e of es){ if(e.t!=="give") continue;
    if(e.plan && e.plan.n>1){ const n = e.plan.n, each = Math.round(e.a/n*100)/100; for(let i=0;i<n;i++){ const amt = i===n-1 ? Math.round((e.a-each*(n-1))*100)/100 : each; parts.push({e, i:i+1, n, a:amt, due:addMonths(e.plan.start||e.at, i)}); } }
    else parts.push({e, i:1, n:1, a:+e.a, due:e.due||0}); }
  for(const p of parts){ const use = Math.min(paid, p.a); p.paid = Math.round(use*100)/100; paid -= use; p.done = p.paid >= p.a - 0.001; }
  return parts;
}
function nextDue(cid){ const p = schedule(cid).find(p=>!p.done && p.due); return p ? p.due : 0; }
function isOverdue(cid){ const nd = nextDue(cid); return !!nd && nd < sod(Date.now()); }
function openSince(cid){
  const es = S.entries.filter(e=>e.c===cid && !e.deleted).sort((a,b)=>a.at-b.at);
  let run = 0, since = 0;
  for(const e of es){ const before = run; run += e.t==="give" ? +e.a : -e.a; if(before<=0.001 && run>0.001) since = e.at; if(run<=0.001) since = 0; }
  return run>0.001 ? since : 0;
}

/* ---------- calculator ---------- */
let calcExpr = "", calcTarget = null, calcJust = false;
function calcEval(src){
  const tk = String(src).replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/,/g,".").match(/\d*\.?\d+%?|[-+*/()]/g) || [];
  let i = 0;
  const num = () => { let x = tk[i++]; if(x===undefined) throw 0; if(x==="(") { const v = expr(); if(tk[i++]!==")") throw 0; return v; } if(x==="-") return -num(); if(x==="+") return num(); if(/%$/.test(x)) return parseFloat(x)/100; const v = parseFloat(x); if(isNaN(v)) throw 0; return v; };
  const term = () => { let v = num(); while(tk[i]==="*"||tk[i]==="/"){ const o = tk[i++]; const r = num(); v = o==="*" ? v*r : v/r; } return v; };
  const expr = () => { let v = term(); while(tk[i]==="+"||tk[i]==="-"){ const o = tk[i++]; const r = term(); v = o==="+" ? v+r : v-r; } return v; };
  const v = expr(); if(i<tk.length || !isFinite(v)) throw 0; return Math.round(v*1e8)/1e8;
}
function calcPreview(){ try{ return calcExpr ? calcEval(calcExpr) : 0; }catch(e){ return null; } }
const calcShow = v => v===null ? "—" : String(v).replace(".",",");
function updCalc(){
  const pv = calcPreview(); const ex = $("#calcl .cexpr"); if(!ex) return drawCalc(true);
  const txt = calcExpr || "0"; ex.textContent = txt; ex.classList.toggle("sm", txt.length > 11); ex.classList.toggle("xs", txt.length > 16);
  $("#calcl .cres").textContent = "= " + calcShow(pv);
  const u = $("#calcl [data-act=cuse]"); if(u) u.textContent = t("useResult") + (pv!==null && calcExpr ? " · " + calcShow(Math.round(pv*100)/100) : "");
}
function drawCalc(force){
  if(!force && $("#calcl .calc")) return updCalc();
  const pv = calcPreview();
  const keys = ["C","⌫","%","÷","7","8","9","×","4","5","6","−","1","2","3","+","00","0",",","="];
  $("#calcl").innerHTML = `<div class="scrim" id="cscrim"><div class="sheet calc" role="dialog" aria-modal="true" aria-label="${t("calc")}"><div class="grab"></div>
    ${shead(t("calc")).replace('data-act="sclose"','data-act="cclose"')}
    <div class="cdisp"><div class="cexpr num ${(calcExpr||"0").length>16?"xs":(calcExpr||"0").length>11?"sm":""}">${esc(calcExpr||"0")}</div><div class="cres num">= ${calcShow(pv)}</div></div>
    <div class="ckeys">${keys.map(k=>`<button type="button" data-ck="${k}" class="${"÷×−+%".includes(k)?"op":k==="="?"eq":k==="C"||k==="⌫"?"fn":""}">${k}</button>`).join("")}</div>
    ${calcTarget?`<button class="btn acc" data-act="cuse" style="margin-top:12px">${t("useResult")}${pv!==null&&calcExpr?" · "+calcShow(pv):""}</button>`:`<button class="btn soft" data-act="ccopy" style="margin-top:12px">${t("copy")}</button>`}
  </div></div>`;
  $("#cscrim").onclick = e => { if(e.target.id==="cscrim") closeCalc(); };
}
function openCalc(target){ calcTarget = target; const el = target && document.getElementById(target); calcExpr = el && el.value ? el.value.replace(/\s/g,"") : ""; calcJust = !!calcExpr; $("#calcl").innerHTML = ""; drawCalc(true); }
function closeCalc(){ $("#calcl").innerHTML = ""; calcTarget = null; }
function calcKey(k){
  const ops = "÷×−+";
  if(k==="C"){ calcExpr=""; }
  else if(k==="⌫"){ calcExpr = calcExpr.slice(0,-1); }
  else if(k==="="){ const v = calcPreview(); if(v!==null && calcExpr) { calcExpr = String(v).replace(".",","); calcJust = true; } drawCalc(); return; }
  else if(ops.includes(k)){ if(!calcExpr && k!=="−") return; if(ops.includes(calcExpr.slice(-1))) calcExpr = calcExpr.slice(0,-1); calcExpr += k; }
  else if(k==="%"){ if(calcExpr && /\d$/.test(calcExpr)) calcExpr += "%"; }
  else if(k===","){ const last = calcExpr.split(/[÷×−+]/).pop(); if(!last.includes(",")) calcExpr += (last===""?"0,":","); }
  else { if(calcJust) calcExpr = ""; calcExpr += k; }
  calcJust = false; drawCalc();
}
document.addEventListener("click", e => {
  const b = e.target.closest("#calcl button"); if(!b) return;
  e.stopPropagation();
  if(b.dataset.ck) return calcKey(b.dataset.ck);
  const a = b.dataset.act;
  if(a==="cclose") return closeCalc();
  if(a==="ccopy"){ const v = calcPreview(); if(v!==null) copyText(calcShow(v)); return; }
  if(a==="cuse"){ const v = calcPreview(); const el = document.getElementById(calcTarget); if(el && v!==null && v>0){ el.value = calcShow(Math.round(v*100)/100); el.dispatchEvent(new Event("input", {bubbles:true})); } closeCalc(); el && el.focus(); return; }
}, true);
document.addEventListener("keydown", e => {
  if(!$("#calcl").innerHTML) return;
  const map = {"*":"×","/":"÷","-":"−","+":"+","Enter":"=","=":"=","Backspace":"⌫","Escape":null,".":",",",":",","%":"%"};
  if(e.key==="Escape"){ closeCalc(); e.stopPropagation(); return; }
  const k = /^[0-9]$/.test(e.key) ? e.key : map[e.key]; if(k){ e.preventDefault(); calcKey(k); }
}, true);

}

let pendingV = null, baseH = null;
const hashStr = x => { let h = 5381; for(let i=0;i<x.length;i++) h = ((h<<5) + h + x.charCodeAt(i)) | 0; return (h>>>0).toString(36); };
async function fetchH(){ const u = new URL(location.href); u.search = ""; u.hash = ""; u.searchParams.set("_u", Date.now()); const r = await fetch(u.toString(), {cache:"no-store"}); if(!r.ok) return null; return hashStr(await r.text()); }
async function doUpdate(v){
  try{ if(navigator.serviceWorker){ const rs = await navigator.serviceWorker.getRegistrations(); for(const r of rs) await r.update(); } if(window.caches){ const ks = await caches.keys(); for(const k of ks) await caches.delete(k); } }catch(_){}
  const u = new URL(location.href); u.searchParams.set("v", v || Date.now()); location.replace(u.toString());
}
const isBusy = () => { const a = document.activeElement; return !!(sheet || sub || $("#calcl").innerHTML || $("#tourl").innerHTML || (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))); };
async function checkUpdate(){
  if(navigator.onLine === false || location.protocol === "file:") return;
  try{ const h = await fetchH(); if(!h) return;
    if(baseH === null){ baseH = h; return; }
    if(h === baseH){ LS.set("updTry", null); return; }
    const v = h;
    // Ҳимоя: шу версияга 2 марта уриниб ҳам ўзгармаса — тинимсиз қайта юкламаймиз, тугма чиқарамиз.
    const tr = LS.get("updTry", null) || {}; const tries = tr.v===v ? (tr.n||0) : 0;
    if(tries < 2 && (!isBusy() || document.hidden)){ LS.set("updTry", {v, n:tries+1}); return doUpdate(v); }
    pendingV = v;
    if(!$("#updl").innerHTML) $("#updl").innerHTML = `<div class="updbar"><span>${t("updAvail")}</span><button data-act="doupdate">${t("updBtn")}</button></div>`;
  }catch(e){}
}

let pnlPeriod = LS.get("dstp","all");
function pnlRange(per){
  const now = new Date(), d0 = sod(Date.now());
  if(per==="today") return [d0, Infinity];
  if(per==="week") return [d0 - ((now.getDay()+6)%7)*864e5, Infinity];
  if(per==="month") return [new Date(now.getFullYear(), now.getMonth(), 1).getTime(), Infinity];
  return [0, Infinity];
}
function debtStats(t0, t1){
  const inR = live().filter(e=>e.at>=t0 && e.at<t1);
  const given = inR.filter(e=>e.t==="give").reduce((s,e)=>s+ +e.a,0);
  const coll = inR.filter(e=>e.t==="take").reduce((s,e)=>s+ +e.a,0);
  const bals = S.customers.map(c=>({c, b:bal(c.id)}));
  const left = bals.filter(x=>x.b>0).reduce((s,x)=>s+x.b,0);
  const r2 = v => Math.round(v*100)/100;
  return {nG:inR.filter(e=>e.t==="give").length, nT:inR.filter(e=>e.t==="take").length, given:r2(given), coll:r2(coll), left:r2(left), people:bals.filter(x=>x.b>0).length, top:bals.filter(x=>x.b>0).sort((a,b)=>b.b-a.b).slice(0,5)};
}

      <div class="dots">${[0,1,2,3].map(i=>`<i class="${i<v.length?"on":""}"></i>`).join("")}</div>
      <div class="err">${err||""}</div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-pin="${n}">${n}</button>`).join("")}<button data-pin="c" aria-label="${t("cancel")}" style="font-size:15px">${onDone.cancelable?t("cancel"):""}</button><button data-pin="0">0</button><button data-pin="b" aria-label="⌫">⌫</button></div>
    </div></div>`;
    document.querySelectorAll("[data-pin]").forEach(b=>b.onclick=async()=>{
      const k=b.dataset.pin;
      if(k==="b"){ v=v.slice(0,-1); return draw(); }
      if(k==="c"){ if(onDone.cancelable){ $("#lockl").innerHTML=""; } return; }
      if(v.length<4) v+=k; draw();
      if(v.length===4){ const r = await onDone(v); if(r===true){ $("#lockl").innerHTML=""; } else { v=""; draw(r); } }
    });
  };
  draw();
}
function lockApp(){
  const h = LS.get("pin",null); if(!h) return;
  pinPad(t("pinEnter"), async p => (await hash(p))===h ? true : t("pinWrong"));
}
function setPin(){
  let first = null;
  const step2 = async p => { if(p!==first) { first=null; setTimeout(()=>pinPad(t("pinNew"), step1),900); return t("pinMismatch"); } LS.set("pin", await hash(p)); toast(t("pinSaved")); renderSub(); return true; };
  const step1 = async p => { first=p; setTimeout(()=>pinPad(t("pinRepeat"), Object.assign(step2,{cancelable:true})),0); return true; };
  step1.cancelable = true;
  pinPad(t("pinNew"), step1);
}
