      <stop offset="0" stop-color="#1FD19B"/><stop offset=".55" stop-color="#0E8C6C"/><stop offset="1" stop-color="#074A3B"/>
    </linearGradient>
    <radialGradient id="glow" cx=".28" cy=".18" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/><stop offset=".5" stop-color="#F5B83D"/><stop offset="1" stop-color="#D98F12"/>
